<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Trash Panda 3.0: Infiltración Urbana</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root { --accent: #f59e0b; --hide-color: #3b82f6; --bg-dark: #030305; }
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: var(--bg-dark); touch-action: none; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
        #game-canvas { position: absolute; inset: 0; z-index: 1; }
        #ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        .interactive { pointer-events: auto; }
        
        /* Menús y UI fluida */
        .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle, rgba(10,10,15,0.85) 0%, rgba(3,3,5,0.95) 100%); backdrop-filter: blur(10px); transition: opacity 0.4s ease; padding: 20px; text-align: center; }
        .hidden { opacity: 0; pointer-events: none; display: none !important; }
        
        .title-text { font-size: clamp(3rem, 12vw, 7rem); font-weight: 900; color: white; letter-spacing: 0.05em; text-shadow: 0 10px 30px rgba(255,255,255,0.15); margin-bottom: 0.2rem; line-height: 1; text-transform: uppercase; }
        .subtitle-text { font-size: clamp(1rem, 4vw, 1.5rem); color: #9ca3af; text-transform: uppercase; letter-spacing: 0.3em; margin-bottom: 2.5rem; }
        
        .btn { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); color: #e5e7eb; padding: clamp(12px, 2.5vh, 18px) clamp(24px, 5vw, 40px); font-size: clamp(1rem, 2.5vw, 1.3rem); font-weight: 600; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); margin: 8px; width: 80%; max-width: 320px; border-radius: 12px; backdrop-filter: blur(4px); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn:hover, .btn:active { background: #ffffff; color: var(--bg-dark); border-color: #ffffff; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(255,255,255,0.1); }
        .btn.active { border-color: var(--accent); color: var(--accent); background: rgba(245, 158, 11, 0.05); }
        
        /* HUD */
        #hud { padding: clamp(15px, 5vw, 30px); padding-top: max(20px, env(safe-area-inset-top)); display: flex; justify-content: space-between; align-items: flex-start; width: 100%; box-sizing: border-box; }
        .status-pill { display: flex; align-items: center; background: rgba(0,0,0,0.6); padding: 8px 20px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(5px); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .hud-text { font-size: clamp(1.1rem, 3vw, 1.6rem); font-weight: 700; color: #fff; }
        #status-dot { width: 14px; height: 14px; border-radius: 50%; background-color: #10b981; margin-right: 12px; box-shadow: 0 0 12px #10b981; transition: all 0.3s; }
        .status-danger { background-color: #ef4444 !important; box-shadow: 0 0 25px #ef4444 !important; transform: scale(1.2); }
        .status-warning { background-color: #f59e0b !important; box-shadow: 0 0 15px #f59e0b !important; }

        /* Barra de Acción sobre la cabeza */
        #action-container { position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%); width: clamp(160px, 35vw, 250px); text-align: center; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 20; }
        #action-text { color: white; margin-bottom: 8px; font-weight: 800; text-shadow: 0px 2px 6px black; font-size: clamp(0.9rem, 2.5vw, 1.3rem); letter-spacing: 1.5px; text-transform: uppercase; }
        #action-bar-bg { width: 100%; height: clamp(10px, 1.5vh, 14px); background: rgba(0,0,0,0.7); border: 2px solid rgba(255,255,255,0.9); border-radius: 8px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        #action-bar-fill { width: 0%; height: 100%; background: var(--accent); box-shadow: 0 0 15px var(--accent); transition: width 0.05s linear; }

        /* Controles Móviles Optimizados */
        #touch-controls { position: absolute; bottom: 0; left: 0; width: 100%; height: 50%; pointer-events: none; display: none; }
        
        .joystick-base { position: absolute; bottom: clamp(30px, 10vh, 60px); left: clamp(30px, 10vw, 60px); width: clamp(120px, 28vmin, 160px); height: clamp(120px, 28vmin, 160px); background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.1) 100%); border: 1px solid rgba(255,255,255,0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
        .joystick-knob { width: 45%; height: 45%; background: rgba(255,255,255,0.8); border-radius: 50%; pointer-events: none; box-shadow: 0 8px 20px rgba(0,0,0,0.5); transition: transform 0.05s, background 0.2s; }
        
        #btn-action-touch { position: absolute; bottom: clamp(30px, 10vh, 60px); right: clamp(30px, 10vw, 60px); width: clamp(90px, 22vmin, 130px); height: clamp(90px, 22vmin, 130px); background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; color: rgba(255,255,255,0.5); font-weight: 800; font-size: clamp(0.9rem, 3vw, 1.3rem); display: flex; align-items: center; justify-content: center; touch-action: none; transition: all 0.2s; backdrop-filter: blur(4px); }
        
        /* Estados dinámicos del botón */
        #btn-action-touch.mode-rummage { border-color: var(--accent); color: var(--accent); background: rgba(245, 158, 11, 0.1); box-shadow: 0 0 25px rgba(245, 158, 11, 0.2); }
        #btn-action-touch.mode-hide { border-color: var(--hide-color); color: var(--hide-color); background: rgba(59, 130, 246, 0.1); box-shadow: 0 0 25px rgba(59, 130, 246, 0.2); }
        #btn-action-touch:active, #btn-action-touch.active-touch { transform: scale(0.92); }
        #btn-action-touch.mode-rummage.active-touch { background: rgba(245, 158, 11, 0.4); }
        #btn-action-touch.mode-hide.active-touch { background: rgba(59, 130, 246, 0.4); }

        #pc-instructions { position: absolute; bottom: 25px; width: 100%; text-align: center; color: rgba(255,255,255,0.5); font-size: clamp(0.8rem, 1.5vw, 1rem); font-weight: 600; letter-spacing: 2px; }
        
        /* Overlay Oscuro al esconderse */
        #hide-overlay { position: absolute; inset: 0; background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.95) 100%); pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 5; }
        
        @keyframes pulseAlert { 0%, 100% { opacity: 0.7; transform: scale(1); text-shadow: 0 0 10px red; } 50% { opacity: 1; transform: scale(1.05); text-shadow: 0 0 25px red; } }
        .alert-anim { animation: pulseAlert 0.4s infinite; color: #ef4444 !important; }
    </style>
</head>
<body>
    <div id="game-canvas"></div>
    <div id="hide-overlay"></div> <!-- Viñeta de escondite -->

    <div id="ui-layer">
        <div id="hud" class="hidden">
            <div class="status-pill interactive">
                <div id="status-dot"></div>
                <div class="hud-text"><span id="score-display">0 / 5</span> <span class="text-gray-400 text-sm font-normal ml-1">Restos</span></div>
            </div>
            <div class="status-pill interactive">
                <div class="hud-text text-gray-400">Nivel <span id="level-display" class="text-white ml-2">1</span></div>
            </div>
        </div>

        <div id="action-container">
            <div id="action-text">ACCIÓN</div>
            <div id="action-bar-bg"><div id="action-bar-fill"></div></div>
        </div>

        <div id="pc-instructions" class="hidden">WASD: Moverse | ESPACIO: Acción (Urgar/Esconderse)</div>

        <div id="touch-controls">
            <div id="joystick-zone" class="joystick-base interactive"><div id="joystick-knob" class="joystick-knob"></div></div>
            <div id="btn-action-touch" class="interactive">N/A</div>
        </div>

        <!-- Menús -->
        <div id="screen-main" class="screen interactive">
            <h1 class="title-text">TRASH<br><span style="color: var(--accent)">PANDA</span> <span class="text-3xl text-gray-500">3.0</span></h1>
            <p class="subtitle-text">Infiltración Máxima</p>
            <button id="btn-play" class="btn">Iniciar Noche</button>
            <button id="btn-settings" class="btn">Opciones</button>
        </div>

        <div id="screen-settings" class="screen hidden interactive">
            <h2 class="title-text" style="font-size: clamp(2rem, 8vw, 4rem);">Ajustes</h2>
            <div class="flex flex-col items-center mb-8 w-full">
                <p class="text-gray-400 mb-4 text-sm tracking-widest uppercase">Seguridad Urbana</p>
                <div class="flex flex-wrap justify-center gap-3 w-full max-w-md">
                    <button class="btn btn-diff active" data-diff="easy" style="width: 40%; min-width: 120px;">Relajado</button>
                    <button class="btn btn-diff" data-diff="normal" style="width: 40%; min-width: 120px;">Normal</button>
                    <button class="btn btn-diff" data-diff="hard" style="width: 40%; min-width: 120px;">Tenso</button>
                </div>
            </div>
            <button id="btn-toggle-sound" class="btn mb-8">Audio: ACTIVADO</button>
            <button id="btn-back" class="btn" style="border-color: rgba(255,255,255,0.1); background: transparent;">Volver</button>
        </div>

        <div id="screen-gameover" class="screen hidden interactive">
            <h1 class="title-text text-red-500">¡ATRAPADO!</h1>
            <p class="subtitle-text text-gray-300">Te descubrieron en la luz.</p>
            <div class="status-pill mb-8 px-8 py-4">
                <span class="hud-text text-gray-400">Llegaste a la calle: <span id="final-level" class="text-white text-2xl ml-2">1</span></span>
            </div>
            <button id="btn-retry" class="btn">Intentar de nuevo</button>
            <button id="btn-menu-from-lose" class="btn" style="background: transparent;">Menú Principal</button>
        </div>

        <div id="screen-win" class="screen hidden interactive">
            <h1 class="title-text text-green-400" style="font-size: clamp(2.5rem, 10vw, 5rem);">¡LIMPIO!</h1>
            <p class="subtitle-text">Basura saqueada sin ser visto.</p>
            <button id="btn-next-level" class="btn active" style="margin-top: 2rem; transform: scale(1.1);">Avanzar Nivel</button>
        </div>
    </div>

    <script>
        /**
         * 1. AUDIO ENGINE (Procedural Web Audio)
         */
        class AudioEngine {
            constructor() {
                this.ctx = null; this.enabled = true; this.bgmOsc = null; this.bgmGain = null; this.lfo = null;
            }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); }
            
            playTone(freq, type, duration, vol = 0.1, slideFreq = null) {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                if (slideFreq) osc.frequency.exponentialRampToValueAtTime(slideFreq, this.ctx.currentTime + duration);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + duration);
            }
            playNoise(duration, vol = 0.1, filterFreq = 1000) {
                if (!this.enabled || !this.ctx) return;
                const bufferSize = this.ctx.sampleRate * duration; const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0); for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = this.ctx.createBufferSource(); noise.buffer = buffer;
                const filter = this.ctx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.value = filterFreq; filter.Q.value = 0.5;
                const gain = this.ctx.createGain(); gain.gain.setValueAtTime(vol, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination); noise.start();
            }
            startBGM() {
                if (!this.enabled || !this.ctx || this.bgmOsc) return;
                this.bgmOsc = this.ctx.createOscillator(); this.bgmGain = this.ctx.createGain();
                this.bgmOsc.type = 'sine'; this.bgmOsc.frequency.value = 50; 
                this.lfo = this.ctx.createOscillator(); this.lfo.type = 'sine'; this.lfo.frequency.value = 0.1;
                const lfoGain = this.ctx.createGain(); lfoGain.gain.value = 0.05;
                this.lfo.connect(lfoGain); lfoGain.connect(this.bgmGain.gain);
                this.bgmGain.gain.value = 0.08;
                this.bgmOsc.connect(this.bgmGain); this.bgmGain.connect(this.ctx.destination);
                this.bgmOsc.start(); this.lfo.start();
            }
            stopBGM() { if (this.bgmOsc) { this.bgmOsc.stop(); this.bgmOsc.disconnect(); this.lfo.stop(); this.lfo.disconnect(); this.bgmOsc = null; } }
            
            sfxStep() { this.playNoise(0.05, 0.02, 300); } // Pasos suaves
            sfxRummage() { this.playNoise(0.15, 0.2, 800 + Math.random()*500); }
            sfxSuccess() { this.playTone(523.25, 'sine', 0.1, 0.2); setTimeout(() => this.playTone(659.25, 'sine', 0.2, 0.2), 100); setTimeout(() => this.playTone(783.99, 'sine', 0.4, 0.2), 200); }
            sfxAlert() { this.playTone(900, 'square', 0.15, 0.1); }
            sfxCaught() { this.playTone(150, 'sawtooth', 0.6, 0.4, 40); this.playNoise(0.6, 0.5, 200); }
            sfxHideIn() { this.playNoise(0.2, 0.15, 400); this.playTone(100, 'sine', 0.2, 0.3, 80); } // Sonido de meterse
            sfxHideOut() { this.playNoise(0.2, 0.15, 600); this.playTone(80, 'sine', 0.2, 0.3, 120); } // Salir
        }
        const audio = new AudioEngine();

        /**
         * 2. ESTADO GENERAL
         */
        const GAME_STATE = { MENU: 0, PLAYING: 1, GAMEOVER: 2, WIN: 3 };
        let state = {
            current: GAME_STATE.MENU, level: 1, score: 0, targetScore: 3, difficulty: 'easy',
            exposureLevel: 0, lastTime: 0,
            actionState: 'none', // 'none', 'rummage', 'hide'
            actionProgress: 0,
            isHiding: false, // Inmunidad
            isMobile: /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
        };

        const config = {
            easy: { carFreq: 0.002, pedCount: 0, detectSpeed: 0.3, walkSpeed: 7.5 },
            normal: { carFreq: 0.008, pedCount: 1, detectSpeed: 0.7, walkSpeed: 7.0 },
            hard: { carFreq: 0.020, pedCount: 2, detectSpeed: 1.5, walkSpeed: 6.5 }
        };

        // Inputs
        const keys = { w: false, a: false, s: false, d: false, space: false };
        let joystick = { x: 0, y: 0, length: 0, active: false };

        /**
         * 3. THREE.JS ENGINE Y TEXTURAS PROCEDURALES
         */
        let scene, camera, renderer, clock;
        let playerObj, playerRig; 
        
        // Gestor de Entidades (Más robusto)
        const entities = {
            trash: [], hides: [], lights: [], cars: [], peds: [], particles: []
        };
        let mapSize = { w: 60, h: 80 };

        // Generador de Texturas Avanzado (Noise y Tiles)
        function createNoiseTex(colorHex, noiseIntensity, scale=1) {
            const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = colorHex; ctx.fillRect(0, 0, 256, 256);
            for(let i=0; i<8000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? `rgba(255,255,255,${noiseIntensity})` : `rgba(0,0,0,${noiseIntensity})`;
                ctx.fillRect(Math.random()*256, Math.random()*256, scale, scale);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(10, 10);
            return tex;
        }

        function createWindowTex() {
            const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#050508'; ctx.fillRect(0,0,256,256); // Pared
            for(let y=0; y<4; y++) {
                for(let x=0; x<4; x++) {
                    // Ventanas encendidas al azar
                    ctx.fillStyle = Math.random() > 0.7 ? '#fbbf24' : '#111827';
                    ctx.fillRect(x*64 + 12, y*64 + 12, 40, 40);
                }
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        let mats; // Inicializado en initThreeJS

        function initThreeJS() {
            const container = document.getElementById('game-canvas');
            clock = new THREE.Clock();
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020204);
            scene.fog = new THREE.FogExp2(0x020204, 0.02);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 150);
            
            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); // Optimizado
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Luces Globales Mejoradas
            const hemiLight = new THREE.HemisphereLight(0x202535, 0x050508, 0.4);
            scene.add(hemiLight);

            const moonLight = new THREE.DirectionalLight(0x4b5563, 0.5);
            moonLight.position.set(30, 50, -40);
            moonLight.castShadow = true;
            moonLight.shadow.mapSize.width = 1024; moonLight.shadow.mapSize.height = 1024;
            moonLight.shadow.camera.near = 1; moonLight.shadow.camera.far = 150;
            const d = 40; moonLight.shadow.camera.left = -d; moonLight.shadow.camera.right = d;
            moonLight.shadow.camera.top = d; moonLight.shadow.camera.bottom = -d;
            moonLight.shadow.bias = -0.0005;
            scene.add(moonLight);

            // Pre-compilar materiales
            mats = {
                asphalt: new THREE.MeshStandardMaterial({ map: createNoiseTex('#111827', 0.05, 2), roughness: 0.9 }),
                sidewalk: new THREE.MeshStandardMaterial({ map: createNoiseTex('#374151', 0.08, 1), roughness: 1.0 }),
                building: new THREE.MeshStandardMaterial({ map: createWindowTex(), roughness: 0.8 }),
                trashFull: new THREE.MeshStandardMaterial({ color: 0x14532d, roughness: 0.6 }), // Verde oscuro
                trashEmpty: new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.9 }), // Gris
                hideSpot: new THREE.MeshStandardMaterial({ color: 0x064e3b, roughness: 0.5 }), // Contenedor grande
                raccoonDark: new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.8 }),
                raccoonLight: new THREE.MeshStandardMaterial({ color: 0x9ca3af, roughness: 0.9 }),
                raccoonBlack: new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.5 }),
                carBody: new THREE.MeshStandardMaterial({ color: 0x7f1d1d, roughness: 0.3, metalness: 0.5 }),
                pedBody: new THREE.MeshStandardMaterial({ color: 0x1e3a8a, roughness: 0.8 }) // Guardia azul
            };
            mats.building.map.repeat.set(10, 10);

            createEnvironment();
            createRaccoon();
            window.addEventListener('resize', onWindowResize, false);
        }

        function createEnvironment() {
            const street = new THREE.Mesh(new THREE.PlaneGeometry(mapSize.w, mapSize.h), mats.asphalt);
            street.rotation.x = -Math.PI / 2; street.receiveShadow = true; scene.add(street);

            const sidewalkGeo = new THREE.BoxGeometry(14, 0.4, mapSize.h);
            const walkL = new THREE.Mesh(sidewalkGeo, mats.sidewalk); walkL.position.set(-17, 0.2, 0); walkL.receiveShadow = true; scene.add(walkL);
            const walkR = new THREE.Mesh(sidewalkGeo, mats.sidewalk); walkR.position.set(17, 0.2, 0); walkR.receiveShadow = true; scene.add(walkR);

            const wallGeo = new THREE.BoxGeometry(10, 20, mapSize.h);
            const wallL = new THREE.Mesh(wallGeo, mats.building); wallL.position.set(-29, 10, 0); scene.add(wallL);
            const wallR = new THREE.Mesh(wallGeo, mats.building); wallR.position.set(29, 10, 0); scene.add(wallR);
        }

        function createRaccoon() {
            playerObj = new THREE.Group();
            playerRig = { walkCycle: 0, stealthFactor: 0 }; 

            const body = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 12), mats.raccoonDark);
            body.scale.set(1.1, 0.9, 1.4); body.position.y = 0.4; body.castShadow = true;
            playerObj.add(body); playerRig.body = body;

            const head = new THREE.Group(); head.position.set(0, 0.2, 0.5); body.add(head); playerRig.head = head;
            const skull = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 10), mats.raccoonLight); skull.castShadow = true; head.add(skull);
            const snout = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.3, 10), mats.raccoonLight); snout.rotateX(Math.PI/2); snout.position.set(0, -0.05, 0.25); head.add(snout);
            const nose = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), mats.raccoonBlack); nose.position.set(0, -0.05, 0.4); head.add(nose);
            const mask = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.12, 0.15), mats.raccoonBlack); mask.position.set(0, 0.05, 0.22); head.add(mask);
            
            const earL = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.15, 6), mats.raccoonDark); earL.position.set(-0.15, 0.2, -0.1); earL.rotation.set(-0.2,0,0.3); head.add(earL);
            const earR = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.15, 6), mats.raccoonDark); earR.position.set(0.15, 0.2, -0.1); earR.rotation.set(-0.2,0,-0.3); head.add(earR);

            // Cola Procedural Simple (Cilindros alternos)
            const tail = new THREE.Group(); tail.position.set(0, 0, -0.4); body.add(tail); playerRig.tail = tail;
            for(let i=0; i<4; i++) {
                const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.12 - i*0.02, 0.14 - i*0.02, 0.2, 8), i%2===0 ? mats.raccoonBlack : mats.raccoonLight);
                ring.rotateX(Math.PI/2); ring.position.z = -i*0.2 - 0.1; ring.castShadow = true;
                tail.add(ring);
            }

            const createLimb = (x, y, z) => {
                const g = new THREE.Group(); g.position.set(x,y,z);
                const m = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.04, 0.3, 6), mats.raccoonBlack); m.position.y = -0.15; m.castShadow = true; g.add(m); body.add(g); return g;
            };
            playerRig.legL = createLimb(-0.2, -0.2, -0.2); playerRig.legR = createLimb(0.2, -0.2, -0.2);
            playerRig.armL = createLimb(-0.2, -0.2, 0.25); playerRig.armR = createLimb(0.2, -0.2, 0.25);

            scene.add(playerObj);
            playerObj.userData = { velocity: new THREE.Vector3(), baseSpeed: 7.0 };
        }

        /**
         * 4. GENERADOR DE NIVELES Y ENTIDADES
         */
        function disposeEntities() {
            const clearArr = (arr) => {
                arr.forEach(e => {
                    if (e.mesh) scene.remove(e.mesh); else if(e instanceof THREE.Object3D) scene.remove(e);
                    if (e.light) { scene.remove(e.light); scene.remove(e.light.target); }
                    if (e.area) scene.remove(e.area);
                });
                arr.length = 0;
            };
            Object.values(entities).forEach(clearArr);
        }

        function generateLevel() {
            disposeEntities();
            state.score = 0; state.targetScore = 3 + Math.floor(state.level * 1.5);
            state.exposureLevel = 0; state.isHiding = false; state.actionState = 'none';
            updateHUD();

            playerObj.position.set(0, 0, 32);
            playerObj.rotation.y = Math.PI; 
            
            const diffConf = config[state.difficulty];
            playerObj.userData.baseSpeed = diffConf.walkSpeed;

            // 4.1. Basureros (Objetivos)
            const trashGeo = new THREE.CylinderGeometry(0.4, 0.35, 1.0, 10);
            for(let i=0; i < state.targetScore + 2; i++) {
                const isLeft = Math.random() > 0.5;
                const mesh = new THREE.Mesh(trashGeo, mats.trashFull);
                mesh.position.set(isLeft ? -12 + Math.random()*2 : 12 - Math.random()*2, 0.5, 25 - (i * (60/state.targetScore)) - Math.random()*5);
                mesh.castShadow = true; mesh.receiveShadow = true;
                scene.add(mesh);
                entities.trash.push({ mesh, looted: false, type: 'trash' });
            }

            // 4.2. Escondites (Dumpsters / Arbustos)
            const hideGeo = new THREE.BoxGeometry(2.0, 1.5, 1.2);
            for(let i=0; i < 3 + Math.floor(state.level/2); i++) {
                const isLeft = Math.random() > 0.5;
                const mesh = new THREE.Mesh(hideGeo, mats.hideSpot);
                mesh.position.set(isLeft ? -14 : 14, 0.75, 20 - Math.random()*50);
                mesh.castShadow = true; mesh.receiveShadow = true;
                scene.add(mesh);
                entities.hides.push({ mesh, type: 'hide' });
            }

            // 4.3. Farolas (Peligros Estáticos)
            for(let i=0; i < 3 + state.level; i++) {
                const isLeft = i % 2 === 0; const x = isLeft ? -10 : 10; const z = 20 - (i * 45/(3+state.level));
                
                const group = new THREE.Group(); group.position.set(x, 0, z);
                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 7, 8), mats.building); pole.position.y=3.5; group.add(pole);
                const lamp = new THREE.Mesh(new THREE.BoxGeometry(1, 0.2, 0.4), mats.building); lamp.position.set(isLeft?0.5:-0.5, 7, 0); group.add(lamp);
                scene.add(group);

                const light = new THREE.SpotLight(0xfff5e6, 3);
                light.position.set(x + (isLeft?0.5:-0.5), 7, z); light.angle = Math.PI/5.5; light.penumbra = 0.5; light.distance = 20; light.castShadow = true;
                light.shadow.mapSize.width = 512; light.shadow.mapSize.height = 512;
                const target = new THREE.Object3D(); target.position.set(x + (isLeft?2.5:-2.5), 0, z); scene.add(target); light.target = target; scene.add(light);

                const area = new THREE.Mesh(new THREE.CircleGeometry(diffConf.lightRadius, 32), new THREE.MeshBasicMaterial({ color: 0xffeebb, transparent: true, opacity: 0.05, depthWrite: false }));
                area.rotation.x = -Math.PI/2; area.position.set(target.position.x, 0.05, target.position.z); scene.add(area);

                entities.lights.push({ group, light, target, area, x: target.position.x, z: target.position.z, r: diffConf.lightRadius });
            }

            // 4.4. Peatones (Guardias Patrullando)
            for(let i=0; i<diffConf.pedCount; i++) { spawnPedestrian(); }
        }

        function spawnPedestrian() {
            const isLeft = Math.random() > 0.5;
            const xPos = isLeft ? -13 : 13;
            
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 0.8, 4, 8), mats.pedBody);
            body.position.y = 0.8; body.castShadow = true; group.add(body);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), mats.raccoonLight);
            head.position.y = 1.8; head.castShadow = true; group.add(head);
            group.position.set(xPos, 0, (Math.random()-0.5)*40);
            scene.add(group);

            // Linterna del peatón
            const light = new THREE.SpotLight(0xccffff, 4);
            light.position.set(0, 1.2, 0); light.angle = Math.PI/6; light.penumbra = 0.3; light.distance = 15; light.castShadow = true;
            const target = new THREE.Object3D(); scene.add(target); light.target = target;
            group.add(light);

            entities.peds.push({ mesh: group, light, target, speed: (2 + Math.random()) * (Math.random()>0.5?1:-1), walkTime: 0, isLeft });
        }

        function spawnCar() {
            const isUp = Math.random() > 0.5; const x = isUp ? 3.5 : -3.5;
            
            const group = new THREE.Group(); group.position.set(x, 0, isUp ? -45 : 45);
            const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.0, 4.5), mats.carBody); body.position.y = 0.7; body.castShadow = true; group.add(body);
            const top = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.7, 2.2), mats.building); top.position.set(0, 1.5, -0.5); group.add(top);
            scene.add(group);

            const addHL = (ox) => {
                const hl = new THREE.SpotLight(0xffffff, 5); hl.position.set(ox, 0.8, isUp?2.3:-2.3);
                hl.angle = Math.PI/4.5; hl.penumbra = 0.6; hl.distance = 30; hl.castShadow = true;
                const t = new THREE.Object3D(); scene.add(t); hl.target = t; group.add(hl); return {light: hl, target: t};
            };
            scene.add(group);
            entities.cars.push({ mesh: group, lights: [addHL(0.7), addHL(-0.7)], speed: isUp ? (12+Math.random()*4) : -(12+Math.random()*4), dirZ: isUp?1:-1 });
        }

        function spawnParticles(pos) {
            for(let i=0; i<5; i++) {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.15,0.15,0.15), new THREE.MeshStandardMaterial({color: Math.random()*0xffffff}));
                mesh.position.copy(pos); mesh.position.y += 0.8;
                scene.add(mesh);
                entities.particles.push({ mesh, vel: new THREE.Vector3((Math.random()-0.5)*5, 3+Math.random()*3, (Math.random()-0.5)*5), life: 1.0 });
            }
        }

        /**
         * 5. LÓGICA DE ACTUALIZACIÓN (Bucle Principal)
         */
        function update(dt) {
            if (state.current !== GAME_STATE.PLAYING) return;
            handleInputAndMovement(dt);
            updateCamera(dt);
            checkInteractions(dt);
            updateAI(dt);
            updateParticles(dt);
            checkStealth(dt);
        }

        function handleInputAndMovement(dt) {
            if (state.actionState === 'rummage') { playerObj.userData.velocity.set(0,0,0); return; } // Detenido si urga
            
            // Movimiento permitido si está escondido (para salir del escondite)
            const move = new THREE.Vector3(); let mag = 0;

            if (joystick.active && joystick.length > 0) {
                move.set(joystick.x, 0, joystick.y); mag = joystick.length;
            } else {
                if (keys.w) move.z -= 1; if (keys.s) move.z += 1;
                if (keys.a) move.x -= 1; if (keys.d) move.x += 1;
                if (move.lengthSq() > 0) { move.normalize(); mag = 1.0; }
            }

            // Si se mueve estando escondido, deshacer escondite
            if (mag > 0.1 && state.isHiding && state.actionState !== 'hide') {
                toggleHide(null);
            }

            if (mag > 0.05 && !state.isHiding) {
                const targetRot = Math.atan2(move.x, move.z);
                let diff = targetRot - playerObj.rotation.y;
                while (diff < -Math.PI) diff += Math.PI * 2; while (diff > Math.PI) diff -= Math.PI * 2;
                playerObj.rotation.y += diff * 12 * dt;

                const curSpeed = playerObj.userData.baseSpeed * mag;
                playerObj.userData.velocity.copy(move).multiplyScalar(curSpeed);
                playerRig.stealthFactor = THREE.MathUtils.lerp(playerRig.stealthFactor, mag < 0.6 ? 1 : 0, 10*dt); // 1 = agachado
            } else {
                playerObj.userData.velocity.lerp(new THREE.Vector3(), 15 * dt);
                playerRig.stealthFactor = THREE.MathUtils.lerp(playerRig.stealthFactor, 0, 10*dt);
            }

            // Integrar
            const nPos = playerObj.position.clone().addScaledVector(playerObj.userData.velocity, dt);
            nPos.x = THREE.MathUtils.clamp(nPos.x, -16.5, 16.5); nPos.z = THREE.MathUtils.clamp(nPos.z, -35, 35);
            
            // Colisiones simples con basureros y contenedores (Radio 0.8)
            let canMove = true;
            [...entities.trash, ...entities.hides].forEach(obj => {
                if(nPos.distanceToSquared(obj.mesh.position) < 0.8) canMove = false;
            });
            if (canMove && !state.isHiding) playerObj.position.copy(nPos);

            updatePlayerAnimation(dt, playerObj.userData.velocity.length());
        }

        function updatePlayerAnimation(dt, speed) {
            if (state.isHiding) { playerObj.visible = false; return; } else { playerObj.visible = true; }

            if (speed > 0.1) {
                playerRig.walkCycle += speed * dt * (3.0 - playerRig.stealthFactor);
                const wc = playerRig.walkCycle;
                const swing = Math.sin(wc) * (0.6 - playerRig.stealthFactor*0.3); // Menos braceo si va en sigilo
                playerRig.legL.rotation.x = swing; playerRig.legR.rotation.x = -swing;
                playerRig.armL.rotation.x = -swing; playerRig.armR.rotation.x = swing;
                
                // Efecto Agachado (Stealth)
                const targetY = 0.4 - (playerRig.stealthFactor * 0.15) + Math.abs(Math.cos(wc))*0.05;
                playerRig.body.position.y = THREE.MathUtils.lerp(playerRig.body.position.y, targetY, 15*dt);
                playerRig.body.rotation.z = Math.sin(wc * 0.5) * 0.05;
                playerRig.tail.rotation.z = Math.sin(wc) * 0.15;

                if (Math.cos(wc) < -0.9 && !playerRig.step) { audio.sfxStep(); playerRig.step = true; } 
                else if (Math.cos(wc) > 0) playerRig.step = false;
            } else {
                playerRig.walkCycle = 0;
                playerRig.legL.rotation.x = THREE.MathUtils.lerp(playerRig.legL.rotation.x, 0, 15*dt);
                playerRig.legR.rotation.x = THREE.MathUtils.lerp(playerRig.legR.rotation.x, 0, 15*dt);
                playerRig.armL.rotation.x = THREE.MathUtils.lerp(playerRig.armL.rotation.x, 0, 15*dt);
                playerRig.armR.rotation.x = THREE.MathUtils.lerp(playerRig.armR.rotation.x, 0, 15*dt);
                playerRig.body.position.y = THREE.MathUtils.lerp(playerRig.body.position.y, 0.4 + Math.sin(clock.elapsedTime*2)*0.02, 10*dt);
            }
        }

        function updateCamera(dt) {
            // Spring dynamics para la cámara (Suave y con anticipación)
            const target = playerObj.position.clone();
            target.y += 14; target.z += 12;
            // Mirar un poco hacia adelante de la velocidad
            target.addScaledVector(playerObj.userData.velocity, 0.5);
            camera.position.lerp(target, 4 * dt);
            camera.lookAt(playerObj.position);
        }

        function updateAI(dt) {
            // Coches
            if(Math.random() < config[state.difficulty].carFreq * (dt*60)) spawnCar();
            for(let i=entities.cars.length-1; i>=0; i--) {
                const c = entities.cars[i];
                c.mesh.position.z += c.speed * dt;
                c.lights.forEach(l => l.target.position.z = c.mesh.position.z + (c.dirZ*15));
                if(Math.abs(c.mesh.position.z) > 50) { scene.remove(c.mesh); entities.cars.splice(i, 1); }
            }

            // Peatones (Patrulla)
            entities.peds.forEach(p => {
                p.mesh.position.z += p.speed * dt;
                if (p.mesh.position.z > 35 || p.mesh.position.z < -35) p.speed *= -1; // Rebotar
                
                // Animar caminar
                p.walkTime += dt * Math.abs(p.speed) * 3;
                p.mesh.position.y = Math.abs(Math.sin(p.walkTime))*0.2;
                
                // Swing de linterna
                const dir = Math.sign(p.speed);
                p.target.position.set(p.mesh.position.x + Math.sin(p.walkTime*0.5)*3, 0, p.mesh.position.z + (dir*8));
            });
        }

        function updateParticles(dt) {
            for(let i=entities.particles.length-1; i>=0; i--) {
                const p = entities.particles[i];
                p.life -= dt;
                if(p.life<=0) { scene.remove(p.mesh); p.mesh.material.dispose(); entities.particles.splice(i,1); continue; }
                p.vel.y -= 15 * dt; // Gravedad fuerte
                p.mesh.position.addScaledVector(p.vel, dt);
                p.mesh.rotation.x += p.vel.z*dt; p.mesh.rotation.y += p.vel.x*dt;
                if(p.mesh.position.y < 0.1) { p.mesh.position.y = 0.1; p.vel.y *= -0.4; p.vel.x *= 0.5; p.vel.z *= 0.5; }
            }
        }

        function checkStealth(dt) {
            if (state.isHiding) {
                reduceExposure(dt*2); return; // Inmune y se recupera rápido
            }

            let inLight = false;
            const pPos = playerObj.position;
            
            // 1. Farolas
            for(let l of entities.lights) {
                if (pPos.distanceToSquared(new THREE.Vector3(l.x, 0, l.z)) < l.r*l.r) { inLight=true; break; }
            }
            // 2. Coches (Cono aproximado frontal)
            if(!inLight) {
                for(let c of entities.cars) {
                    const dz = pPos.z - c.mesh.position.z;
                    if(Math.abs(pPos.x - c.mesh.position.x) < 4 && Math.abs(dz) < 18 && Math.sign(dz) === c.dirZ) { inLight=true; break; }
                }
            }
            // 3. Peatones (Cono de linterna direccional)
            if(!inLight) {
                for(let p of entities.peds) {
                    if(pPos.distanceTo(p.mesh.position) < 10) {
                        const dirToPlayer = pPos.clone().sub(p.mesh.position).normalize();
                        const dirLight = p.target.position.clone().sub(p.mesh.position).normalize();
                        if(dirToPlayer.dot(dirLight) > 0.8) { inLight=true; break; } // Cono de visión 
                    }
                }
            }

            // Alertas
            const ind = document.getElementById('status-dot');
            const hud = document.querySelector('#score-display').parentElement;
            if(inLight) {
                if(state.exposureLevel === 0) audio.sfxAlert();
                state.exposureLevel += config[state.difficulty].detectSpeed * dt;
                ind.className = 'status-danger'; hud.classList.add('alert-anim');
                if(state.exposureLevel >= 1.0) gameOver();
            } else {
                reduceExposure(dt*1.5);
                hud.classList.remove('alert-anim');
                ind.className = state.exposureLevel > 0 ? 'status-warning' : '';
            }
        }

        function reduceExposure(amount) {
            state.exposureLevel = Math.max(0, state.exposureLevel - amount);
        }

        /**
         * 6. SISTEMA DE INTERACCIÓN (Urgar y Esconderse)
         */
        function checkInteractions(dt) {
            let target = null; let minD = 3.0; // DistSq = aprox 1.7m
            
            // Buscar más cercano (Priorizar esconderse si asustado?)
            [...entities.trash, ...entities.hides].forEach(obj => {
                if (obj.type === 'trash' && obj.looted) return;
                const d = playerObj.position.distanceToSquared(obj.mesh.position);
                if (d < minD) { minD = d; target = obj; }
            });

            const btn = document.getElementById('btn-action-touch');
            const actCont = document.getElementById('action-container');
            const actTxt = document.getElementById('action-text');
            const isPressed = keys.space || btn.classList.contains('active-touch');

            // Si estamos escondidos, sobreescribir lógica
            if (state.isHiding) {
                setUIState(btn, actCont, actTxt, 'SALIR', 'mode-hide', true);
                if (isPressed && state.actionState === 'none') toggleHide(null); // Sale al soltar, requerirá lógica de cooldown o keyUp, pero por simplicidad de un frame:
                // Para evitar salida inmediata, limpiamos keys.space:
                if (keys.space) keys.space = false; 
                btn.classList.remove('active-touch');
                return;
            }

            if (target) {
                const isHideSpot = target.type === 'hide';
                setUIState(btn, actCont, actTxt, isHideSpot ? 'ESCONDERSE' : 'URGAR', isHideSpot ? 'mode-hide' : 'mode-rummage', true);

                if (isPressed) {
                    if (isHideSpot && state.actionState === 'none') {
                        toggleHide(target);
                        keys.space = false; btn.classList.remove('active-touch'); // debounce manual
                    } else if (!isHideSpot) {
                        handleRummage(dt, target);
                    }
                } else {
                    cancelAction();
                }
            } else {
                setUIState(btn, actCont, actTxt, 'N/A', '', false);
                cancelAction();
            }
        }

        function setUIState(btn, cont, txtUI, txt, modeClass, show) {
            if(state.isMobile) {
                btn.innerText = txt;
                btn.className = `interactive ${modeClass}`;
                if(show) btn.classList.add('highlight'); else btn.classList.remove('highlight');
            }
            if(show && !state.isHiding) {
                cont.style.opacity = '1'; txtUI.innerText = txt;
            } else {
                cont.style.opacity = '0';
            }
        }

        function toggleHide(spot) {
            state.isHiding = !state.isHiding;
            const overlay = document.getElementById('hide-overlay');
            if (state.isHiding && spot) {
                audio.sfxHideIn();
                playerObj.position.copy(spot.mesh.position); // Mover al centro
                playerObj.userData.velocity.set(0,0,0);
                overlay.style.opacity = '1';
                state.actionState = 'hide';
            } else {
                audio.sfxHideOut();
                overlay.style.opacity = '0';
                state.actionState = 'none';
                // Pequeño salto hacia adelante para salir
                const forward = new THREE.Vector3(0,0,1).applyAxisAngle(new THREE.Vector3(0,1,0), playerObj.rotation.y);
                playerObj.position.addScaledVector(forward, 1.5);
            }
        }

        function handleRummage(dt, target) {
            if (state.actionState !== 'rummage') {
                state.actionState = 'rummage';
                playerObj.lookAt(target.mesh.position.x, playerObj.position.y, target.mesh.position.z);
            }
            state.actionProgress += dt;
            if(Math.random()>0.8) { audio.sfxRummage(); spawnParticles(target.mesh.position); playerRig.body.rotation.z = (Math.random()-0.5)*0.2; }
            document.getElementById('action-bar-fill').style.width = Math.min((state.actionProgress/1.5)*100, 100) + '%';
            if(state.actionProgress >= 1.5) completeRummage(target);
        }

        function cancelAction() {
            if(state.actionState === 'rummage') { state.actionState = 'none'; state.actionProgress = 0; document.getElementById('action-bar-fill').style.width = '0%'; }
        }

        function completeRummage(trashObj) {
            trashObj.looted = true; trashObj.mesh.material = mats.trashEmpty;
            for(let i=0; i<4; i++) spawnParticles(trashObj.mesh.position);
            state.score++; updateHUD(); audio.sfxSuccess(); cancelAction();
            if(state.score >= state.targetScore) setTimeout(levelComplete, 500);
        }

        /**
         * 7. UI Y FLUJO DEL JUEGO
         */
        function updateHUD() {
            document.getElementById('score-display').innerText = `${state.score} / ${state.targetScore}`;
            document.getElementById('level-display').innerText = state.level;
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            if(id) { const el = document.getElementById(id); el.classList.remove('hidden'); setTimeout(()=>el.style.opacity='1', 10); }
        }

        function startGame() {
            audio.init(); audio.startBGM();
            state.level = 1; state.current = GAME_STATE.PLAYING;
            generateLevel(); showScreen(null);
            document.getElementById('hud').classList.remove('hidden');
            if(state.isMobile) document.getElementById('touch-controls').style.display = 'block';
            else { const pi = document.getElementById('pc-instructions'); pi.classList.remove('hidden'); setTimeout(()=>pi.classList.add('hidden'), 5000); }
        }

        function levelComplete() {
            state.current = GAME_STATE.WIN; showScreen('screen-win');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('touch-controls').style.display = 'none';
            document.getElementById('hide-overlay').style.opacity = '0';
        }
        
        function nextLevel() { state.level++; state.current = GAME_STATE.PLAYING; generateLevel(); showScreen(null); document.getElementById('hud').classList.remove('hidden'); if(state.isMobile) document.getElementById('touch-controls').style.display = 'block'; }

        function gameOver() {
            state.current = GAME_STATE.GAMEOVER; audio.sfxCaught(); audio.stopBGM();
            document.getElementById('final-level').innerText = state.level;
            showScreen('screen-gameover'); document.getElementById('hud').classList.add('hidden');
            document.getElementById('touch-controls').style.display = 'none';
            document.getElementById('hide-overlay').style.opacity = '0';
        }

        function animate(time) {
            requestAnimationFrame(animate);
            let dt = (time - state.lastTime) / 1000; state.lastTime = time;
            if(dt > 0.1) dt = 0.1; // Cap delta para evitar glitches físicos
            if(state.current === GAME_STATE.PLAYING) update(dt);
            renderer.render(scene, camera);
        }

        // Eventos
        const setKey = (e, d) => { const k=e.key.toLowerCase(); if(['w','arrowup'].includes(k)) keys.w=d; if(['s','arrowdown'].includes(k)) keys.s=d; if(['a','arrowleft'].includes(k)) keys.a=d; if(['d','arrowright'].includes(k)) keys.d=d; if(k===' ') keys.space=d; };
        window.addEventListener('keydown', e => setKey(e, true)); window.addEventListener('keyup', e => setKey(e, false));
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

        // Touch Joystick Analógico
        const jZone = document.getElementById('joystick-zone'); const jKnob = document.getElementById('joystick-knob');
        let jCenter = {x:0, y:0}; let maxDist = 50;
        jZone.addEventListener('touchstart', e => { e.preventDefault(); joystick.active=true; const r=jZone.getBoundingClientRect(); maxDist=r.width/2.5; jCenter={x:r.left+r.width/2, y:r.top+r.height/2}; upJoy(e.touches[0]); },{passive:false});
        jZone.addEventListener('touchmove', e => { e.preventDefault(); if(joystick.active) upJoy(e.touches[0]); },{passive:false});
        const resJoy = () => { joystick.active=false; joystick.x=joystick.y=joystick.length=0; jKnob.style.transform='translate(0,0)'; };
        jZone.addEventListener('touchend', resJoy); jZone.addEventListener('touchcancel', resJoy);
        function upJoy(t) {
            const dx=t.clientX-jCenter.x, dy=t.clientY-jCenter.y; const dist=Math.hypot(dx,dy);
            const nDist=Math.min(dist/maxDist, 1.0);
            jKnob.style.transform = `translate(${(dx/dist||0)*(nDist*maxDist)}px, ${(dy/dist||0)*(nDist*maxDist)}px)`;
            joystick.length=nDist; joystick.x=(dx/dist)||0; joystick.y=(dy/dist)||0;
        }

        const btnAct = document.getElementById('btn-action-touch');
        btnAct.addEventListener('touchstart', e => { e.preventDefault(); btnAct.classList.add('active-touch'); keys.space=true; });
        btnAct.addEventListener('touchend', e => { e.preventDefault(); btnAct.classList.remove('active-touch'); keys.space=false; });

        document.getElementById('btn-play').addEventListener('click', startGame);
        document.getElementById('btn-settings').addEventListener('click', () => showScreen('screen-settings'));
        document.getElementById('btn-back').addEventListener('click', () => showScreen('screen-main'));
        document.getElementById('btn-retry').addEventListener('click', startGame);
        document.getElementById('btn-menu-from-lose').addEventListener('click', () => showScreen('screen-main'));
        document.getElementById('btn-next-level').addEventListener('click', nextLevel);
        document.querySelectorAll('.btn-diff').forEach(b => b.addEventListener('click', e => { document.querySelectorAll('.btn-diff').forEach(x=>x.classList.remove('active')); e.target.classList.add('active'); state.difficulty=e.target.dataset.diff; }));
        document.getElementById('btn-toggle-sound').addEventListener('click', e => { audio.enabled = !audio.enabled; e.target.innerText = audio.enabled ? 'Audio: ACTIVADO' : 'Audio: MUTEADO'; if(!audio.enabled) audio.stopBGM(); });

        document.addEventListener('contextmenu', e => e.preventDefault()); document.addEventListener('touchmove', e => {if(e.target.tagName!=='BUTTON')e.preventDefault();}, {passive:false});

        initThreeJS(); requestAnimationFrame(animate);
    </script>
</body>
</html>
